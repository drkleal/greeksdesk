name: Test and deploy GreeksDesk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: greeksdesk-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checks
        run: node --test
      - name: Verify packaged app starts
        run: |
          docker build -t greeksdesk-smoke .
          docker run --rm -d --name greeksdesk-smoke -p 8080:8080 -e DESK_PASSWORD=smoke-only greeksdesk-smoke
          trap 'docker logs greeksdesk-smoke; docker stop greeksdesk-smoke' EXIT
          curl --fail --max-time 10 --retry 8 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/healthz
          curl --fail --user drkleal:smoke-only http://127.0.0.1:8080/plan.mjs --output /dev/null
          curl --fail --user drkleal:smoke-only http://127.0.0.1:8080/evidence.mjs --output /dev/null
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy GreeksDesk
        run: flyctl deploy --remote-only --app greeksdesk
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
